name: 大连特价机票每日更新
on:
  schedule:
    - cron: '25 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_deals.py'
      - 'scripts/life_common.py'
      - 'scripts/life-requirements.txt'
      - '.github/workflows/deals.yml'
permissions:
  contents: write
concurrency:
  group: life-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装免费开源岗位表解析库
        run: python -m pip install -r scripts/life-requirements.txt
      - name: 验证解析和失败保留逻辑
        run: python -m unittest discover -s tests -p 'test_life.py' -v
      - name: 抓取公开信息
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_deals.py
      - name: 仅提交本频道数据（失败也记录检查时间）
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deals.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: 更新大连 deals 信息与检查状态'
            # 天气工作流可同时更新；变基到最新分支，避免覆盖天气提交。
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_BRANCH"
              if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            done
            exit 1
          fi
      - name: 报告来源异常
        if: steps.fetch.outcome == 'failure'
        run: exit 1
