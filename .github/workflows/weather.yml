name: 大连天气更新
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_weather.py'
      - '.github/workflows/weather.yml'
permissions:
  contents: write
concurrency:
  group: weather-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 验证提醒逻辑
        run: python -m unittest discover -s tests -v
      - name: 按北京时间时段分层抓取并合并提醒
        id: fetch
        continue-on-error: true
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
        run: python scripts/fetch_weather.py
      - name: 提交天气和提醒（失败时也更新错误提醒）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather.json data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: 更新大连天气与变化提醒'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: 报告抓取失败
        if: steps.fetch.outcome == 'failure'
        run: exit 1
